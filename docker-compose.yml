version: '3.8'

services:
  # File Storage Server
  server:
    build:
      context: .
      dockerfile: file-storage-server/Dockerfile
    container_name: file-storage-server
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_HTTP_HOST=0.0.0.0
      - QUARKUS_LOG_LEVEL=INFO
    volumes:
      - server-data:/app/data-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/q/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - file-storage-network

  # File Storage Client (for testing)
  client:
    build:
      context: .
      dockerfile: file-storage-client/Dockerfile
    container_name: file-storage-client
    environment:
      - FSSERVER_API_ROOTURL=http://server:8080
    depends_on:
      server:
        condition: service_healthy
    networks:
      - file-storage-network
    # Override entrypoint to keep container running for manual testing
    command: ["tail", "-f", "/dev/null"]

volumes:
  server-data:
    driver: local

networks:
  file-storage-network:
    driver: bridge
