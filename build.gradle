buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }
    }
}

plugins {
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs' version '6.0.26' apply false
}

apply plugin:'base'

allprojects {
    group "com.tools"
    version "1.0.0-SNAPSHOT"
    
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'checkstyle'
    apply plugin: 'pmd'
    apply plugin: 'com.github.spotbugs'

    checkstyle {
        toolVersion = '10.20.2'
        configFile = file("${rootProject.projectDir}/config/checkstyle/checkstyle.xml")
        ignoreFailures = true
        maxWarnings = 0
    }

    pmd {
        toolVersion = '7.8.0'
        ruleSetFiles = files("${rootProject.projectDir}/config/pmd/pmd-ruleset.xml")
        ignoreFailures = true
        ruleSets = []
    }

    spotbugs {
        toolVersion = '4.8.6'
        ignoreFailures = true
    }
    
    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        reports {
            html.required = true
            xml.required = false
        }
    }
    
    // Exclude Quarkus generated sources from static analysis
    tasks.matching { it.name in ['pmdMain', 'spotbugsMain'] }.configureEach {
        mustRunAfter tasks.matching { it.name.startsWith('compile') }
    }
}

//Ensure client jar is copied from nested build folder into top level one
task distClient(type: Copy) {
    dependsOn ':file-storage-client:jar'
    from "file-storage-client/build/libs/file-storage-client-1.0.0-SNAPSHOT.jar"
    into "${project.buildDir}/fsclient"
}

//Ensure server jar is copied from nested build folder into top level one
task distServer(type: Copy) {
    dependsOn ':file-storage-server:quarkusBuild'
    from "file-storage-server/build/file-storage-server-1.0.0-SNAPSHOT-runner.jar"
    into "${project.buildDir}/fsserver"
    rename { String fileName ->
        fileName.replace('-runner', '')
    }
}